# Octadecimal Studio - Docker Compose (Development Override)
# Nadpisuje ustawienia z docker-compose.yml dla środowiska deweloperskiego
# Użycie: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

name: octadecimal-studio

services:
  app:
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - XDEBUG_MODE=debug,develop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/var/www/html
      - ./php/php.dev.ini:/usr/local/etc/php/conf.d/custom.ini

  nginx:
    ports:
      - "8084:80"  # Zmienione z 8082 - konflikt z projektem octadecimal
    # Port 443 celowo pominięty w dev - brak SSL

  mysql:
    ports:
      - "3310:3306"  # Zmienione z 3309 - unikatowy port

  redis:
    ports:
      - "6382:6379"  # Zmienione z 6380 - konflikt z projektem octadecimal

  # Mailpit do przechwytywania emaili w dev
  mailpit:
    image: axllent/mailpit:latest
    container_name: octadecimal_studio_mailpit
    restart: unless-stopped
    ports:
      - "8027:8025"  # UI - zmienione z 8025 - konflikt z projektem octadecimal
      - "1027:1025"  # SMTP - zmienione z 1025 - konflikt z projektem octadecimal
    volumes:
      - mailpit_data:/data
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
      - MP_DATA_FILE=/data/mailpit.db
      - MP_MAX_MESSAGES=500
      - MP_MAX_MESSAGE_SIZE=10485760
    networks:
      - octadecimal_studio

  # Fetchmail do pobierania emaili z OVH i przekazywania do Mailpit
  fetchmail:
    build:
      context: ./fetchmail
      dockerfile: Dockerfile
    container_name: octadecimal_studio_fetchmail
    restart: unless-stopped
    volumes:
      - ./fetchmail/fetchmailrc:/etc/fetchmail/fetchmailrc
      - fetchmail_logs:/var/log/fetchmail
      - fetchmail_mail:/var/mail/fetchmail
    environment:
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=1025
      - FETCHMAIL_INTERVAL=${FETCHMAIL_INTERVAL:-300}
    networks:
      - octadecimal_studio
    depends_on:
      - mailpit

  # PHPMyAdmin dla łatwego dostępu do bazy
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: octadecimal_studio_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"  # Zmienione z 8081 - konflikt z projektem octadecimal
    environment:
      - PMA_HOST=mysql
      - PMA_USER=${DB_USERNAME:-octadecimal_studio}
      - PMA_PASSWORD=${DB_PASSWORD:-secret}
    networks:
      - octadecimal_studio
    depends_on:
      - mysql

volumes:
  mailpit_data:
    driver: local
  fetchmail_logs:
    driver: local
  fetchmail_mail:
    driver: local
