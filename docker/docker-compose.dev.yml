# Octadecimal Studio - Docker Compose (Development Override)
# Nadpisuje ustawienia z docker-compose.yml dla środowiska deweloperskiego
# Użycie: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  app:
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - XDEBUG_MODE=debug,develop
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../src:/var/www/html
      - ./php/php.dev.ini:/usr/local/etc/php/conf.d/custom.ini

  nginx:
    ports:
      - "8082:80"
    # Port 443 celowo pominięty w dev - brak SSL

  mysql:
    ports:
      - "3307:3306"

  redis:
    ports:
      - "6380:6379"

  # Mailpit do przechwytywania emaili w dev
  mailpit:
    image: axllent/mailpit:latest
    container_name: octadecimal_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"  # UI
      - "1025:1025"  # SMTP
    volumes:
      - mailpit_data:/data
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:1025
      - MP_UI_BIND_ADDR=0.0.0.0:8025
      - MP_DATA_FILE=/data/mailpit.db
      - MP_MAX_MESSAGES=500
      - MP_MAX_MESSAGE_SIZE=10485760
    networks:
      - octadecimal

  # Fetchmail do pobierania emaili z OVH i przekazywania do Mailpit
  fetchmail:
    build:
      context: ./fetchmail
      dockerfile: Dockerfile
    container_name: octadecimal_fetchmail
    restart: unless-stopped
    volumes:
      - ./fetchmail/fetchmailrc:/etc/fetchmail/fetchmailrc
      - fetchmail_logs:/var/log/fetchmail
      - fetchmail_mail:/var/mail/fetchmail
    environment:
      - MAILPIT_HOST=mailpit
      - MAILPIT_PORT=1025
      - FETCHMAIL_INTERVAL=${FETCHMAIL_INTERVAL:-300}
    networks:
      - octadecimal
    depends_on:
      - mailpit

  # PHPMyAdmin dla łatwego dostępu do bazy
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: octadecimal_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_USER=${DB_USERNAME:-octadecimal}
      - PMA_PASSWORD=${DB_PASSWORD:-secret}
    networks:
      - octadecimal
    depends_on:
      - mysql

volumes:
  mailpit_data:
    driver: local
  fetchmail_logs:
    driver: local
  fetchmail_mail:
    driver: local
