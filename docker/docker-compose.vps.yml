# Octadecimal Studio - Docker Compose Override dla VPS
# Użycie na VPS obok istniejących usług (Strapi, CMS Gateway).
# Porty: 1340 (app), 3308 (MySQL), 6381 (Redis) – bez konfliktu z 1337–1339, 3100, 3307.
# Uruchom: docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d

name: octadecimal-studio

services:
  app:
    container_name: octadecimal_studio_app
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  nginx:
    container_name: octadecimal_studio_nginx
    ports:
      - "1340:80"

  mysql:
    container_name: octadecimal_studio_mysql
    ports:
      - "3308:3306"

  redis:
    container_name: octadecimal_studio_redis
    ports:
      - "6381:6379"

  queue:
    container_name: octadecimal_studio_queue

  scheduler:
    container_name: octadecimal_studio_scheduler
